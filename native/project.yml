# Generates Pedalfun.xcodeproj:  cd native && xcodegen
name: Pedalfun
options:
  bundleIdPrefix: com.wangzhixuan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Pedalfun:
    type: application
    platform: iOS
    sources:
      - Pedalfun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangzhixuan.pedalfun
        DEVELOPMENT_TEAM: 2F4FJS7J37
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Pedalfun/Info.plist
      properties:
        CFBundleDisplayName: Pedalfun
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: 用于记录骑行的速度、里程和轨迹。
        NSMotionUsageDescription: 用气压计计算爬升和坡度。
  PedalfunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PedalfunTests
    dependencies:
      - target: Pedalfun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangzhixuan.pedalfun.tests
        DEVELOPMENT_TEAM: 2F4FJS7J37
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pedalfun.app/Pedalfun
        BUNDLE_LOADER: $(TEST_HOST)
  PedalfunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PedalfunUITests
    dependencies:
      - target: Pedalfun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangzhixuan.pedalfun.uitests
        DEVELOPMENT_TEAM: 2F4FJS7J37
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  Pedalfun:
    build:
      targets:
        Pedalfun: all
        PedalfunTests: [test]
        PedalfunUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PedalfunTests
        - PedalfunUITests
